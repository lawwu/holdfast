name: macOS build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to publish; leave empty to build and test only'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A manual retry and a tag push share the same group. Never interrupt an upload.
concurrency:
  group: macos-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Resolve source and validate the version tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: python3 scripts/release_ref.py --tag "$RELEASE_TAG"

  build:
    name: Build and test Apple Silicon installer
    needs: resolve
    # MLX's pinned dependencies require Swift 6.3, newer than macos-15's Xcode.
    runs-on: xcode-27
    timeout-minutes: 90
    # A release build signs and notarizes with secrets kept in the protected `release` environment
    # (required reviewer: the owner). Pull requests and main pushes get no environment and no secrets,
    # and build the unsigned preview as before.
    environment: ${{ needs.resolve.outputs.publish == 'true' && 'release' || '' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOLDFAST_BUILD_JOBS: '2'
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      SIGNED_RELEASE: ${{ needs.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun swift --version
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - id: node
        name: Use the same Node version as the installer
        run: |
          python3 -c 'import json, os; print("version=" + json.load(open("packaging/node-runtime.json"))["version"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: |
            Packages/pi-swift-mlx/package-lock.json
            Runtime/pi/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/xcode/SourcePackages
            .build/distribution-xcode
          key: macos27-arm64-xcode27.2-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            macos27-arm64-xcode27.2-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-
      - name: Test release guards, reusable packages, and Pi
        run: |
          python3 -m unittest discover -s Tests -p 'test_release.py' -v
          npm ci --prefix Packages/pi-swift-mlx --ignore-scripts --no-audit --no-fund
          npm test --prefix Packages/pi-swift-mlx
          npm ci --prefix Runtime/pi --ignore-scripts --no-audit --no-fund
          npm test --prefix Runtime/pi
          bash scripts/test_agent_runtime.sh
          bash scripts/test_custom_models.sh
          bash scripts/test_model_downloads.sh
          python3 Tests/model_provider_transport.py
      - name: Load the Developer ID certificates and notary key
        if: env.SIGNED_RELEASE == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::The release environment is missing the $name secret (docs/releases.md)"; exit 1; fi
          done
          keychain="$RUNNER_TEMP/holdfast-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Apple's Developer ID intermediate, pinned, so the chain builds on any runner image.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          application="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          installer="$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)"
          if [ -z "$application" ] || [ -z "$installer" ]; then
            echo "::error::The .p12 must hold both Developer ID Application and Developer ID Installer identities"; exit 1
          fi
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "HOLDFAST_SIGNING_KEYCHAIN=$keychain"
            echo "HOLDFAST_SIGNING_IDENTITY=$application"
            echo "HOLDFAST_INSTALLER_IDENTITY=$installer"
            echo "HOLDFAST_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "HOLDFAST_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "HOLDFAST_NOTARY_ISSUER=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "Signing as: $application / $installer"
      - name: Build the installer
        run: |
          mkdir -p build/logs
          if [ "$SIGNED_RELEASE" = true ]; then
            python3 scripts/build_release.py 2>&1 | tee build/logs/installer-build.log
          else
            python3 scripts/build_release.py --unsigned-preview 2>&1 | tee build/logs/installer-build.log
          fi
      - name: Test the exact installer without running MLX inference
        run: |
          python3 Tests/installer_integration.py "build/releases/$RELEASE_VERSION" 2>&1 | tee build/logs/installer-test.log
          python3 -c 'import json, os; v=json.load(open("build/releases/"+os.environ["RELEASE_VERSION"]+"/verification.json")); assert v["passed"] and not v["realEmbeddedMLXTested"]'
      - name: Package and verify the same app in a disk image
        run: python3 scripts/package_release_dmg.py "build/releases/$RELEASE_VERSION" 2>&1 | tee build/logs/dmg-test.log
      - name: Remove the signing keychain and notary key
        if: always() && env.SIGNED_RELEASE == 'true'
        run: |
          if [ -n "${HOLDFAST_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$HOLDFAST_SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-installer
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            build/releases/${{ needs.resolve.outputs.version }}/*.pkg
            build/releases/${{ needs.resolve.outputs.version }}/*.dmg
            build/releases/${{ needs.resolve.outputs.version }}/*.dmg.sha256
            build/releases/${{ needs.resolve.outputs.version }}/dmg-verification.json
            build/releases/${{ needs.resolve.outputs.version }}/SHA256SUMS
            build/releases/${{ needs.resolve.outputs.version }}/release-manifest.json
            build/releases/${{ needs.resolve.outputs.version }}/verification.json
            build/releases/${{ needs.resolve.outputs.version }}/*notarization*.json
      - name: Save build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish signed release
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true' && github.repository == 'lawwu/holdfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-installer
          path: build/releases/${{ needs.resolve.outputs.version }}
      - name: Publish the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        # No --allow-unsigned-preview: a version tag publishes only a signed, notarized build.
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG" --publish --include-dmg

  documentation:
    name: Deploy release documentation
    needs: [resolve, publish]
    if: needs.resolve.outputs.publish == 'true' && github.repository == 'lawwu/holdfast'
    # Publishing with GITHUB_TOKEN doesn't emit a new release-triggered workflow.
    # Call the same docs workflow explicitly after the release is published.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
