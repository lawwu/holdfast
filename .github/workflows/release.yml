name: macOS build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to publish; leave empty to build and test only'
        required: false
        type: string

permissions:
  contents: read

# A manual retry and a tag push share the same group. Never interrupt an upload.
concurrency:
  group: macos-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Resolve source and validate the version tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: python3 scripts/release_ref.py --tag "$RELEASE_TAG"

  build:
    name: Build and test Apple Silicon installer
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOLDFAST_BUILD_JOBS: '2'
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun swift --version
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - id: node
        name: Use the same Node version as the installer
        run: |
          python3 -c 'import json, os; print("version=" + json.load(open("packaging/node-runtime.json"))["version"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: |
            Packages/pi-swift-mlx/package-lock.json
            Runtime/pi/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/xcode/SourcePackages
            .build/distribution-xcode
          key: macos-arm64-xcode26.3-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            macos-arm64-xcode26.3-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-
      - name: Test release guards, reusable packages, and Pi
        run: |
          python3 -m unittest discover -s Tests -p 'test_release.py' -v
          npm ci --prefix Packages/pi-swift-mlx --ignore-scripts --no-audit --no-fund
          npm test --prefix Packages/pi-swift-mlx
          npm ci --prefix Runtime/pi --ignore-scripts --no-audit --no-fund
          npm test --prefix Runtime/pi
          bash scripts/test_agent_runtime.sh
          python3 Tests/model_provider_transport.py
      - name: Build the unsigned installer
        run: |
          mkdir -p build/logs
          python3 scripts/build_release.py --unsigned-preview 2>&1 | tee build/logs/installer-build.log
      - name: Test the exact installer without running MLX inference
        run: |
          python3 Tests/installer_integration.py "build/releases/$RELEASE_VERSION" 2>&1 | tee build/logs/installer-test.log
          python3 -c 'import json, os; v=json.load(open("build/releases/"+os.environ["RELEASE_VERSION"]+"/verification.json")); assert v["passed"] and not v["realEmbeddedMLXTested"]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-installer
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            build/releases/${{ needs.resolve.outputs.version }}/*.pkg
            build/releases/${{ needs.resolve.outputs.version }}/SHA256SUMS
            build/releases/${{ needs.resolve.outputs.version }}/release-manifest.json
            build/releases/${{ needs.resolve.outputs.version }}/verification.json
      - name: Save build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish unsigned prerelease
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true' && github.repository == 'lawwu/holdfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-installer
          path: build/releases/${{ needs.resolve.outputs.version }}
      - name: Publish the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG" --publish --allow-unsigned-preview
