name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published vX.Y.Z release to deploy; leave empty to check only'
        type: string
        required: false
  workflow_call:
    inputs:
      release_tag:
        description: 'Published release whose documentation should be deployed'
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# All release deployments share a group; branch checks never publish.
concurrency:
  group: docs-${{ (inputs.release_tag || github.event_name == 'release') && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Select documentation source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test publication guards
        run: |
          python3 -m unittest discover -s Tests -p 'test_release.py' -v
          python3 -m unittest discover -s Tests -p 'test_updates.py' -v
      - id: release
        name: Require a published release before deploying
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: python3 scripts/docs_release.py --tag "$RELEASE_TAG"

  build:
    name: Build and check documentation
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.2'
          # This job builds the artifact Pages deploys, so it doesn't restore cached state.
          package-manager-cache: false
      - name: Install documentation dependencies
        working-directory: Website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check links
        working-directory: Website
        run: |
          npm run build
          npm test
      - name: Check navigation, search, and mobile layouts
        working-directory: Website
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Include the latest published update feed
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Always fetch latest, even when retrying an older documentation deployment.
        run: python3 scripts/deploy_update_feed.py Website/dist
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: Website/dist
          retention-days: 7
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation-test-results
          path: Website/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish documentation to GitHub Pages
    needs: [resolve, build]
    if: github.repository == 'lawwu/holdfast' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check this repository's Pages configuration
        uses: actions/configure-pages@v6.0.0
      - name: Deploy the tested documentation artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
