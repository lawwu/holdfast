name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Serialize updates so an older build cannot replace a newer deployment.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Install documentation dependencies
        working-directory: Website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check links
        working-directory: Website
        run: |
          npm run build
          npm test
      - name: Check navigation, search, and mobile layouts
        working-directory: Website
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: Website/dist
          include-hidden-files: true # Retain .nojekyll for branch-based Pages.
          if-no-files-found: error
          retention-days: 7
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-test-results
          path: Website/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish documentation to GitHub Pages
    needs: build
    if: github.repository == 'lawwu/holdfast' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation
          path: public
      # The app repository is private. Only the built site goes to this public repo.
      # This key has write access to holdfast-docs alone; PR jobs never receive it.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: lawwu/holdfast-docs
          publish_branch: main
          publish_dir: public
          full_commit_message: Update Holdfast documentation
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
