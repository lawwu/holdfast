# One-time migration of the existing docs site. Remove after the first deployment.
name: Initialize Holdfast Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publication
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'lawwu/holdfast' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ''

  initialize:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
